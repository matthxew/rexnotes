      <h1 style="font-size:54px;margin:0 0 16px;">Rex's Notes</h1>
      <p style="font-size:20px;line-height:1.5;color:#3c3d44;margin:0 0 32px;">A small, considered dinosaur guide. Twenty species, drawn and described for kids who love dinosaurs and the grown-ups reading along.</p>
      <h2 style="font-size:28px;margin:32px 0 12px;">Species</h2>
      <ul style="list-style:none;padding:0;font-size:18px;line-height:1.7;">
          <li><a href="/d/tyrannosaurus-rex" style="color:#1c2a55;">Tyrannosaurus rex</a> — The one everyone draws first.</li>
          <li><a href="/d/triceratops" style="color:#1c2a55;">Triceratops</a> — Three horns, one giant frill, no patience.</li>
          <li><a href="/d/stegosaurus" style="color:#1c2a55;">Stegosaurus</a> — Plates on top, spikes on the back.</li>
          <li><a href="/d/brachiosaurus" style="color:#1c2a55;">Brachiosaurus</a> — Built like a four-story crane.</li>
          <li><a href="/d/velociraptor" style="color:#1c2a55;">Velociraptor</a> — Turkey-sized, fully feathered, very fast.</li>
          <li><a href="/d/spinosaurus" style="color:#1c2a55;">Spinosaurus</a> — Sail on its back, paddle for a tail.</li>
          <li><a href="/d/ankylosaurus" style="color:#1c2a55;">Ankylosaurus</a> — Living tank with a club for a tail.</li>
          <li><a href="/d/parasaurolophus" style="color:#1c2a55;">Parasaurolophus</a> — A trombone with legs.</li>
          <li><a href="/d/therizinosaurus" style="color:#1c2a55;">Therizinosaurus</a> — Giant feathered claws, salad eater.</li>
          <li><a href="/d/microraptor" style="color:#1c2a55;">Microraptor</a> — Four wings. Iridescent black. The size of a crow.</li>
          <li><a href="/d/diplodocus" style="color:#1c2a55;">Diplodocus</a> — All neck and tail, very little middle.</li>
          <li><a href="/d/allosaurus" style="color:#1c2a55;">Allosaurus</a> — The Jurassic's main predator.</li>
          <li><a href="/d/iguanodon" style="color:#1c2a55;">Iguanodon</a> — A thumb spike for trouble.</li>
          <li><a href="/d/pachycephalosaurus" style="color:#1c2a55;">Pachycephalosaurus</a> — Skull like a bowling ball.</li>
          <li><a href="/d/carnotaurus" style="color:#1c2a55;">Carnotaurus</a> — Bull-horned, fast, and tiny-armed.</li>
          <li><a href="/d/plateosaurus" style="color:#1c2a55;">Plateosaurus</a> — An early giant, before the giants.</li>
          <li><a href="/d/coelophysis" style="color:#1c2a55;">Coelophysis</a> — Slim, fast, hollow-boned.</li>
          <li><a href="/d/eoraptor" style="color:#1c2a55;">Eoraptor</a> — One of the very first dinosaurs.</li>
          <li><a href="/d/deinonychus" style="color:#1c2a55;">Deinonychus</a> — The real raptor everyone is thinking of.</li>
          <li><a href="/d/ichthyovenator" style="color:#1c2a55;">Ichthyovenator</a> — A spinosaur with a split sail.</li>
        </ul>
