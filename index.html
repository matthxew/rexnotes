    <main style="max-width:64ch;margin:48px auto;padding:0 20px;font-family:Georgia,serif;color:#1c1e25;">
      <h1 style="font-size:54px;margin:0 0 16px;">Rex's Notes</h1>
      <p style="font-size:20px;line-height:1.5;color:#3c3d44;margin:0 0 32px;">A small, considered dinosaur guide. Twenty species, drawn and described for kids who love dinosaurs and the grown-ups reading along.</p>
      <h2 style="font-size:28px;margin:32px 0 12px;">Species</h2>
      <ul style="list-style:none;padding:0;font-size:18px;line-height:1.7;">
          <li><a href="/d/tyrannosaurus-rex" style="color:#1c2a55;">Tyrannosaurus rex</a> — The one everyone draws first.</li>
          <li><a href="/d/triceratops" style="color:#1c2a55;">Triceratops</a> — Three horns, one giant frill, no patience.</li>
          <li><a href="/d/stegosaurus" style="color:#1c2a55;">Stegosaurus</a> — Plates on top, spikes on the back.</li>
          <li><a href="/d/brachiosaurus" style="color:#1c2a55;">Brachiosaurus</a> — Built like a four-story crane.</li>
          <li><a href="/d/velociraptor" style="color:#1c2a55;">Velociraptor</a> — Turkey-sized, fully feathered, very fast.</li>
          <li><a href="/d/spinosaurus" style="color:#1c2a55;">Spinosaurus</a> — Sail on its back, paddle for a tail.</li>
          <li><a href="/d/ankylosaurus" style="color:#1c2a55;">Ankylosaurus</a> — Living tank with a club for a tail.</li>
          <li><a href="/d/parasaurolophus" style="color:#1c2a55;">Parasaurolophus</a> — A trombone with legs.</li>
          <li><a href="/d/therizinosaurus" style="color:#1c2a55;">Therizinosaurus</a> — Giant feathered claws, salad eater.</li>
          <li><a href="/d/microraptor" style="color:#1c2a55;">Microraptor</a> — Four wings. Iridescent black. The size of a crow.</li>
          <li><a href="/d/diplodocus" style="color:#1c2a55;">Diplodocus</a> — All neck and tail, very little middle.</li>
          <li><a href="/d/allosaurus" style="color:#1c2a55;">Allosaurus</a> — The Jurassic's main predator.</li>
          <li><a href="/d/iguanodon" style="color:#1c2a55;">Iguanodon</a> — A thumb spike for trouble.</li>
          <li><a href="/d/pachycephalosaurus" style="color:#1c2a55;">Pachycephalosaurus</a> — Skull like a bowling ball.</li>
          <li><a href="/d/carnotaurus" style="color:#1c2a55;">Carnotaurus</a> — Bull-horned, fast, and tiny-armed.</li>
          <li><a href="/d/plateosaurus" style="color:#1c2a55;">Plateosaurus</a> — An early giant, before the giants.</li>
          <li><a href="/d/coelophysis" style="color:#1c2a55;">Coelophysis</a> — Slim, fast, hollow-boned.</li>
          <li><a href="/d/eoraptor" style="color:#1c2a55;">Eoraptor</a> — One of the very first dinosaurs.</li>
          <li><a href="/d/deinonychus" style="color:#1c2a55;">Deinonychus</a> — The real raptor everyone is thinking of.</li>
          <li><a href="/d/ichthyovenator" style="color:#1c2a55;">Ichthyovenator</a> — A spinosaur with a split sail.</li>
        </ul>
      <p style="margin-top:32px;"><a href="/about" style="color:#1c2a55;">About</a></p>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"de75b3d4-7c15-4a1f-a028-3510dc1860e3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ce93c83c-481a-4c01-8ac2-7dc1ee430d14\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n/* DinoKid — graphic, bold, magazine-leaning */\n:root {\n  --paper: oklch(0.975 0.004 220);\n  --paper-2: oklch(0.955 0.006 220);\n  --paper-3: oklch(0.93 0.008 220);\n  --ink: oklch(0.18 0.01 240);\n  --ink-2: oklch(0.36 0.01 240);\n  --ink-3: oklch(0.58 0.01 240);\n  --rule: oklch(0.88 0.006 240);\n  --rule-2: oklch(0.92 0.006 240);\n\n  --accent: oklch(0.86 0.18 145);          /* fresh green */\n  --accent-ink: oklch(0.22 0.05 150);\n\n  /* Era — used as small text/dot only, no big washes */\n  --triassic: oklch(0.55 0.13 35);\n  --jurassic: oklch(0.5 0.12 155);\n  --cretaceous: oklch(0.45 0.13 265);\n\n  --serif: \"Instrument Serif\", \"Times New Roman\", Times, serif;\n  --sans: \"DM Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --mono: \"IBM Plex Mono\", ui-monospace, Menlo, monospace;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 16px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n::selection { background: var(--accent); color: var(--accent-ink); }\n\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }\n\n.serif { font-family: var(--serif); }\n.mono  { font-family: var(--mono); }\n\n.shell { max-width: 1320px; margin: 0 auto; padding: 0 40px; }\n@media (max-width: 1024px) { .shell { padding: 0 32px; } }\n@media (max-width: 640px) { .shell { padding: 0 22px; } }\n\n/* ——— masthead: dense, rule-lined, magazine ——— */\n.masthead {\n  border-bottom: 1px solid var(--ink);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 50;\n}\n.masthead-row {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: stretch;\n  min-height: 84px;\n  border-bottom: 1px solid var(--rule);\n}\n@media (max-width: 720px) {\n  .masthead-row { grid-template-columns: 1fr auto; min-height: 0; }\n  .masthead-row .mast-search { grid-column: 1 / -1; order: 3; border-top: 1px solid var(--rule); padding: 6px 22px; }\n}\n.masthead-row > * { display: flex; align-items: center; }\n.brand {\n  font-family: var(--serif);\n  font-size: 34px;\n  letter-spacing: -0.015em;\n  padding: 14px 36px 14px 0;\n  border-right: 1px solid var(--rule);\n  font-style: italic;\n  white-space: nowrap;\n  flex-shrink: 0;\n  min-width: max-content;\n  display: flex; align-items: center; gap: 0;\n}\n@media (max-width: 720px) {\n  .brand { font-size: 28px; padding: 16px 22px 16px 0; }\n}\n.brand b { font-style: normal; font-family: var(--serif); font-weight: 400; }\n.brand .dot {\n  display: inline-block; width: 8px; height: 8px;\n  background: var(--accent); border-radius: 50%;\n  margin-left: 10px;\n  flex-shrink: 0;\n}\n\n.mast-search {\n  flex: 1;\n  display: flex; align-items: center; gap: 14px;\n  padding: 0 32px;\n}\n.mast-search svg { color: var(--ink-3); flex-shrink: 0; }\n.mast-search input {\n  flex: 1;\n  font: inherit;\n  font-family: var(--serif);\n  font-size: 22px;\n  font-style: italic;\n  background: transparent;\n  border: none;\n  padding: 16px 0;\n  color: var(--ink);\n  outline: none;\n  min-height: 44px;\n}\n.mast-search input::placeholder { color: var(--ink-3); }\n.mast-search .clear {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.1em;\n  color: var(--ink-3);\n  padding: 4px 8px;\n}\n.mast-search .clear:hover { color: var(--ink); }\n\n.nav {\n  display: flex;\n  border-left: 1px solid var(--rule);\n  height: 100%;\n}\n.nav button {\n  font-family: var(--mono);\n  font-size: 12px;\n  text-transform: uppercase;\n  letter-spacing: 0.16em;\n  color: var(--ink-2);\n  padding: 0 28px;\n  min-height: 84px;\n  height: 100%;\n  display: flex; align-items: center;\n  border-right: 1px solid var(--rule);\n  transition: background 160ms ease, color 160ms ease;\n}\n@media (max-width: 720px) {\n  .nav button { padding: 0 20px; min-height: 64px; }\n}\n.nav button:last-child { border-right: none; }\n.nav button:hover { background: var(--paper-2); color: var(--ink); }\n.nav button.active { background: var(--ink); color: var(--paper); }\n\n/* second row of masthead: filters */\n.mast-filters {\n  display: flex; align-items: center; gap: 0;\n  padding: 0;\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  color: var(--ink-3);\n  overflow-x: auto;\n}\n.mast-filters .group {\n  display: flex; align-items: center; gap: 10px;\n  padding: 16px 32px;\n  border-right: 1px solid var(--rule);\n}\n@media (max-width: 720px) {\n  .mast-filters .group { padding: 14px 22px; }\n}\n.mast-filters .group:last-child { border-right: none; }\n.mast-filters .group-label {\n  color: var(--ink-3);\n  margin-right: 4px;\n}\n.chip {\n  font-family: var(--mono); font-size: 12px;\n  text-transform: uppercase; letter-spacing: 0.12em;\n  color: var(--ink-2);\n  padding: 9px 14px;\n  border: 1px solid var(--rule);\n  background: var(--paper);\n  transition: all 140ms ease;\n  white-space: nowrap;\n  border-radius: 0;\n  min-height: 36px;\n}\n.chip:hover { border-color: var(--ink); color: var(--ink); }\n.chip.on {\n  background: var(--accent);\n  color: var(--accent-ink);\n  border-color: var(--accent-ink);\n}\n\n/* ——— hero: minimal, no volume copy ——— */\n.hero {\n  padding: 56px 0 36px;\n  border-bottom: 1px solid var(--rule);\n}\n.hero h1 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: clamp(48px, 8vw, 116px);\n  line-height: 1.02;\n  letter-spacing: -0.035em;\n  margin: 0;\n  padding-bottom: 0.08em;\n  text-wrap: balance;\n}\n.hero h1 em { font-style: italic; }\n.hero h1 .accent {\n  background: var(--accent); color: var(--accent-ink);\n  padding: 0 0.15em;\n  font-style: italic;\n}\n.hero .dek {\n  margin-top: 36px;\n  max-width: 60ch;\n  font-size: 17px;\n  line-height: 1.55;\n  color: var(--ink-2);\n  text-wrap: pretty;\n}\n\n/* ——— results meta ——— */\n.results-meta {\n  padding: 18px 0 14px;\n  display: flex; justify-content: space-between; align-items: baseline;\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.12em;\n  color: var(--ink-3);\n}\n.results-meta strong { color: var(--ink); font-weight: 500; }\n\n/* ——— grid ——— */\n.grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 0;\n  border-top: 1px solid var(--ink);\n  border-bottom: 1px solid var(--ink);\n}\n@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }\n@media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 460px)  { .grid { grid-template-columns: 1fr; } }\n\n.card {\n  background: var(--paper);\n  padding: 22px 22px 26px;\n  text-align: left;\n  display: flex; flex-direction: column; gap: 16px;\n  cursor: pointer;\n  border-right: 1px solid var(--rule);\n  border-bottom: 1px solid var(--rule);\n  transition: background 200ms ease;\n  position: relative;\n  min-height: 360px;\n}\n.card:nth-child(4n) { border-right: none; }\n@media (max-width: 1100px) {\n  .card { border-right: 1px solid var(--rule); }\n  .card:nth-child(4n) { border-right: 1px solid var(--rule); }\n  .card:nth-child(3n) { border-right: none; }\n}\n@media (max-width: 760px) {\n  .card:nth-child(3n) { border-right: 1px solid var(--rule); }\n  .card:nth-child(2n) { border-right: none; }\n}\n@media (max-width: 460px) {\n  .card { border-right: none; }\n}\n\n.card:hover { background: var(--paper-2); }\n.card:hover .card-illus { background: var(--accent); }\n.card-illus {\n  aspect-ratio: 4 / 3;\n  background: var(--paper-3);\n  display: flex; align-items: center; justify-content: center;\n  overflow: hidden;\n  position: relative;\n  transition: background 220ms ease;\n}\n\n.card .meta-row {\n  display: flex; align-items: center; gap: 10px;\n  font-family: var(--mono); font-size: 10.5px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink-3);\n}\n.card .era-dot {\n  width: 7px; height: 7px;\n  display: inline-block;\n}\n.era-dot[data-era=\"Triassic\"]   { background: var(--triassic); }\n.era-dot[data-era=\"Jurassic\"]   { background: var(--jurassic); }\n.era-dot[data-era=\"Cretaceous\"] { background: var(--cretaceous); }\n\n.card h3 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: 32px;\n  line-height: 1;\n  letter-spacing: -0.02em;\n  margin: 0;\n  text-wrap: balance;\n}\n.card .teaser {\n  color: var(--ink-2);\n  font-size: 14.5px;\n  line-height: 1.45;\n  margin: 0;\n  text-wrap: pretty;\n}\n.card .arrow {\n  font-family: var(--serif);\n  font-size: 22px;\n  font-style: italic;\n  color: var(--ink-3);\n  transition: transform 220ms ease, color 220ms ease;\n  margin-top: auto;\n}\n.card:hover .arrow { transform: translateX(6px); color: var(--ink); }\n\n/* ——— empty ——— */\n.empty {\n  padding: 100px 0;\n  text-align: center;\n  color: var(--ink-3);\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: 28px;\n}\n\n/* ——— detail page ——— */\n.detail { padding: 28px 0 80px; }\n.back-link {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink-3);\n  display: inline-flex; align-items: center; gap: 8px;\n  margin-bottom: 28px;\n  transition: color 160ms ease;\n}\n.back-link:hover { color: var(--ink); }\n\n.detail-hero {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 28px;\n  padding-bottom: 36px;\n}\n.detail-name-row {\n  display: flex; align-items: baseline; gap: 18px;\n  flex-wrap: wrap;\n}\n.detail h1 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: clamp(52px, 9vw, 132px);\n  line-height: 1;\n  letter-spacing: -0.035em;\n  margin: 0;\n  padding-bottom: 0.06em;\n  font-style: italic;\n  text-wrap: balance;\n  overflow-wrap: break-word;\n}\n.pronunciation {\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.08em;\n  color: var(--ink-3);\n  text-transform: uppercase;\n  display: flex; align-items: center; gap: 8px;\n}\n.pronunciation strong { color: var(--ink); font-weight: 500; }\n\n.detail-content {\n  display: grid;\n  grid-template-columns: 1.05fr 1fr;\n  gap: 48px;\n  margin-top: 24px;\n}\n@media (max-width: 880px) { .detail-content { grid-template-columns: 1fr; gap: 28px; } }\n\n.detail-illus {\n  aspect-ratio: 5 / 4;\n  background: var(--paper-2);\n  display: flex; align-items: center; justify-content: center;\n  position: relative;\n  overflow: hidden;\n  border-radius: 14px;\n}\n\n.detail-meta-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 0;\n  background: var(--paper-2);\n  border-radius: 14px;\n  overflow: hidden;\n}\n.meta-item {\n  padding: 22px 24px;\n}\n.meta-item .meta-label {\n  font-family: var(--mono); font-size: 10px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink-3);\n  margin-bottom: 6px;\n}\n.meta-item .meta-value {\n  font-family: var(--serif);\n  font-size: 22px;\n  line-height: 1.15;\n  font-style: italic;\n}\n.meta-item .meta-value.era[data-era=\"Triassic\"]   { color: var(--triassic); }\n.meta-item .meta-value.era[data-era=\"Jurassic\"]   { color: var(--jurassic); }\n.meta-item .meta-value.era[data-era=\"Cretaceous\"] { color: var(--cretaceous); }\n\n.size-line {\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: 26px;\n  line-height: 1.25;\n  color: var(--ink);\n  padding: 24px 0 0;\n  text-wrap: pretty;\n}\n.size-line .label {\n  display: block;\n  font-family: var(--mono);\n  font-style: normal;\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 0.16em;\n  color: var(--ink-3);\n  margin-bottom: 8px;\n}\n\n/* facts */\n.facts {\n  padding: 88px 0 24px;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 80px;\n}\n.facts.with-rule { border-top: none; }\n.fact-block { padding: 0; }\n@media (max-width: 880px) {\n  .facts { grid-template-columns: 1fr; gap: 56px; padding: 64px 0 16px; }\n}\n.fact-block .fact-label {\n  font-family: var(--mono); font-size: 13px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink);\n  font-weight: 500;\n  margin-bottom: 22px;\n  display: inline-flex; align-items: center; gap: 12px;\n}\n.fact-block.kids .fact-label::before {\n  content: \"\"; width: 14px; height: 14px;\n  background: var(--accent);\n  border-radius: 50%;\n}\n.fact-block.parents .fact-label::before {\n  content: \"\"; width: 14px; height: 14px;\n  background: var(--ink);\n  border-radius: 50%;\n}\n.fact-block .fact-label::after { content: none; }\n.fact-block h2 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: 38px;\n  line-height: 1.02;\n  letter-spacing: -0.02em;\n  margin: 0 0 18px;\n  font-style: italic;\n}\n.fact-block .fact-body {\n  font-size: 16.5px;\n  line-height: 1.65;\n  color: var(--ink);\n  text-wrap: pretty;\n}\n.fact-block.kids .fact-body { font-size: 18px; line-height: 1.6; }\n\n/* trivia */\n.trivia { padding: 72px 0 56px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 16px; }\n.trivia h3 {\n  font-family: var(--mono); font-size: 13px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink);\n  margin: 0 0 32px;\n  font-weight: 500;\n  display: inline-flex; align-items: center; gap: 12px;\n}\n.trivia h3::before {\n  content: \"\"; width: 14px; height: 14px;\n  background: oklch(0.45 0.08 50);\n  border-radius: 50%;\n}\n.trivia ul {\n  list-style: none; padding: 0; margin: 0;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 48px;\n  counter-reset: triv;\n}\n@media (max-width: 880px) { .trivia ul { grid-template-columns: 1fr; gap: 40px; } }\n.trivia li {\n  font-family: var(--sans);\n  font-size: 16.5px;\n  line-height: 1.65;\n  padding: 0;\n  text-wrap: pretty;\n  color: var(--ink);\n}\n.trivia li::before {\n  content: \"0\" counter(triv);\n  counter-increment: triv;\n  display: block;\n  font-family: var(--mono);\n  font-style: normal;\n  font-size: 10px;\n  letter-spacing: 0.16em;\n  color: var(--ink-3);\n  margin-bottom: 12px;\n}\n\n/* downloads */\n.downloads { padding: 56px 0 72px; }\n.downloads h3 {\n  font-family: var(--mono); font-size: 13px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink);\n  margin: 0 0 24px;\n  font-weight: 500;\n  display: inline-flex; align-items: center; gap: 12px;\n}\n.downloads h3::before {\n  content: \"\"; width: 14px; height: 14px;\n  background: var(--accent);\n  border-radius: 50%;\n}\n.download-list { display: flex; flex-direction: column; gap: 16px; }\n.download-item {\n  padding: 24px 28px;\n  display: flex; justify-content: space-between; align-items: center;\n  gap: 24px;\n  cursor: pointer;\n  transition: transform 200ms ease, background 200ms ease;\n  text-align: left;\n  width: 100%;\n  background: var(--paper-2);\n  border-radius: 14px;\n}\n.download-item:hover { background: var(--paper-3); transform: translateY(-2px); }\n.download-item .dl-name {\n  font-family: var(--serif);\n  font-size: 28px;\n  font-weight: 400;\n}\n.download-item .dl-meta {\n  font-family: var(--mono); font-size: 10.5px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  color: var(--ink-3);\n  margin-top: 6px;\n}\n.download-item .dl-action {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--accent-ink);\n  background: var(--accent);\n  padding: 10px 16px;\n  border-radius: 999px;\n  white-space: nowrap;\n}\n\n/* prev/next */\n.pn-nav {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\n  margin-top: 24px;\n}\n.pn-item {\n  padding: 24px 28px;\n  text-align: left;\n  cursor: pointer;\n  transition: background 200ms ease, transform 200ms ease;\n  background: var(--paper-2);\n  border-radius: 14px;\n}\n.pn-item:last-child { text-align: right; }\n.pn-item:hover { background: var(--paper-3); transform: translateY(-2px); }\n.pn-item .pn-label {\n  font-family: var(--mono); font-size: 10px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink-3);\n  margin-bottom: 10px;\n}\n.pn-item .pn-name {\n  font-family: var(--serif);\n  font-size: 30px;\n  line-height: 1;\n}\n\n/* ——— about ——— */\n.about { padding: 64px 0 100px; max-width: 64ch; }\n.about h1 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: clamp(48px, 7vw, 88px);\n  line-height: 0.95;\n  letter-spacing: -0.03em;\n  margin: 0 0 32px;\n  text-wrap: pretty;\n  font-style: italic;\n}\n.about p {\n  font-family: var(--serif);\n  font-size: 22px;\n  line-height: 1.5;\n  margin: 0 0 22px;\n  color: var(--ink);\n  text-wrap: pretty;\n}\n.about p.dek {\n  font-style: italic;\n  color: var(--ink-2);\n  font-size: 26px;\n  line-height: 1.35;\n}\n.about .field-note {\n  margin-top: 40px;\n  padding-top: 24px;\n  border-top: 1px solid var(--ink);\n  font-family: var(--mono);\n  font-size: 13px;\n  line-height: 1.7;\n  color: var(--ink-3);\n}\n\n/* ——— footer ——— */\n.foot {\n  border-top: 1px solid var(--ink);\n  padding: 28px 0 36px;\n  margin-top: 32px;\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink-3);\n  display: flex; justify-content: space-between; align-items: baseline; gap: 24px;\n  flex-wrap: wrap;\n}\n.foot .name { font-family: var(--serif); font-size: 16px; text-transform: none; letter-spacing: -0.01em; color: var(--ink); font-style: italic; }\n\n/* ——— transitions ——— */\n.fade-in { animation: fade-in 380ms cubic-bezier(.2,.7,.2,1) both; }\n@keyframes fade-in {\n  from { opacity: 0; transform: translateY(6px); }\n  to { opacity: 1; transform: translateY(0); }\n}\n.stagger > * { animation: fade-in 460ms cubic-bezier(.2,.7,.2,1) both; }\n.stagger > *:nth-child(1)  { animation-delay: 0ms;  }\n.stagger > *:nth-child(2)  { animation-delay: 30ms; }\n.stagger > *:nth-child(3)  { animation-delay: 60ms; }\n.stagger > *:nth-child(4)  { animation-delay: 90ms; }\n.stagger > *:nth-child(5)  { animation-delay: 120ms;}\n.stagger > *:nth-child(6)  { animation-delay: 150ms;}\n.stagger > *:nth-child(7)  { animation-delay: 180ms;}\n.stagger > *:nth-child(8)  { animation-delay: 210ms;}\n.stagger > *:nth-child(n+9){ animation-delay: 240ms;}\n\n/* ——— silhouette caption ——— */\n.silhouette-caption {\n  position: absolute;\n  bottom: 8px; left: 10px;\n  font-family: var(--mono);\n  font-size: 9.5px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  opacity: 0.7;\n}\n\n/* Timeline view styles */\n.timeline { padding: 40px 0 80px; }\n.tl-header { max-width: 64ch; margin-bottom: 36px; }\n.tl-header h1 {\n  font-family: var(--serif);\n  font-weight: 400;\n  font-size: clamp(48px, 7vw, 88px);\n  line-height: 1;\n  letter-spacing: -0.03em;\n  margin: 0 0 16px;\n}\n.tl-header h1 .tl-accent {\n  background: var(--accent); color: var(--accent-ink);\n  font-style: italic; padding: 0 0.15em;\n}\n.tl-dek {\n  font-size: 16px; line-height: 1.55; color: var(--ink-2);\n  margin: 0; max-width: 56ch;\n}\n.tl-key {\n  display: inline-block;\n  font-family: var(--mono); font-size: 11px;\n  background: var(--paper-2); border: 1px solid var(--rule);\n  padding: 1px 7px; border-radius: 4px; color: var(--ink);\n  margin: 0 2px;\n}\n.tl-legend {\n  font-family: var(--sans);\n  font-size: 14px; line-height: 1.55; color: var(--ink-3);\n  margin: 12px 0 0; max-width: 60ch;\n}\n.tl-legend em { font-style: italic; color: var(--ink-2); }\n.tl-legend-chip {\n  display: inline-block;\n  font-family: var(--mono); font-size: 10px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  background: var(--ink); color: var(--paper);\n  padding: 2px 8px; border-radius: 4px;\n  margin-right: 2px;\n  vertical-align: 1px;\n}\n\n.tl-callout-top {\n  background: var(--paper-2);\n  border-radius: 14px;\n  padding: 26px 32px;\n  margin-bottom: 24px;\n}\n.tl-top-head {\n  display: flex; align-items: baseline; justify-content: space-between;\n  gap: 24px;\n  margin-bottom: 10px;\n}\n.tl-top-meta {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 24px;\n  margin-top: 18px;\n  padding-top: 18px;\n  border-top: 1px solid var(--rule);\n}\n@media (max-width: 600px) {\n  .tl-top-head { flex-direction: column; align-items: flex-start; gap: 14px; }\n  .tl-top-meta { grid-template-columns: 1fr; gap: 14px; }\n}\n.tl-callout-label {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink-3); white-space: nowrap;\n}\n.tl-callout-name {\n  font-family: var(--serif); font-style: italic;\n  font-size: clamp(28px, 4vw, 44px);\n  line-height: 1;\n  letter-spacing: -0.02em;\n}\n.tl-callout-fact {\n  font-family: var(--sans);\n  font-size: 16px; line-height: 1.55;\n  color: var(--ink-2);\n  text-wrap: pretty;\n  margin: 0;\n}\n\n/* Track */\n.tl-track {\n  position: relative;\n  background: var(--paper-2);\n  border-radius: 14px;\n  padding: 28px 24px 76px;\n  cursor: ew-resize;\n  user-select: none;\n  touch-action: pan-y;\n}\n.tl-dots { overflow: visible; }\n.tl-bands {\n  position: relative;\n  height: 32px;\n  margin-bottom: 16px;\n}\n.tl-band {\n  position: absolute; top: 0; bottom: 0;\n  display: flex; align-items: center;\n  padding: 0 12px;\n  border-radius: 6px;\n}\n.tl-band[data-era=\"Triassic\"]   { background: color-mix(in oklab, var(--triassic) 22%, var(--paper)); }\n.tl-band[data-era=\"Jurassic\"]   { background: color-mix(in oklab, var(--jurassic) 22%, var(--paper)); }\n.tl-band[data-era=\"Cretaceous\"] { background: color-mix(in oklab, var(--cretaceous) 22%, var(--paper)); }\n.tl-band-label {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.16em;\n  color: var(--ink);\n  font-weight: 500;\n}\n\n.tl-dots {\n  position: relative;\n  margin-bottom: 12px;\n}\n.tl-dot {\n  position: absolute;\n  transform: translate(-50%, 0);\n  display: flex; flex-direction: column; align-items: center;\n  gap: 6px;\n  cursor: pointer;\n  transition: transform 240ms cubic-bezier(.2,.7,.2,1), opacity 240ms ease;\n  opacity: 0.55;\n  pointer-events: auto;\n}\n.tl-dot .tl-dot-name {\n  position: absolute;\n  top: 18px;\n  left: 50%;\n  transform: translateX(-50%);\n  font-family: var(--mono); font-size: 9.5px;\n  letter-spacing: 0.06em;\n  color: var(--ink-2);\n  white-space: nowrap;\n  text-transform: uppercase;\n  pointer-events: none;\n}\n.tl-dot:hover { opacity: 1; }\n.tl-dot.in-bar { opacity: 1; }\n.tl-dot.in-bar .tl-dot-marker {\n  outline: 3px solid color-mix(in oklab, var(--ink) 18%, transparent);\n  outline-offset: 2px;\n}\n.tl-dot.is-near {\n  opacity: 1;\n  transform: translate(-50%, -10px) scale(1.45);\n  z-index: 5;\n}\n.tl-dot-marker {\n  width: 14px; height: 14px;\n  border-radius: 50%;\n  background: var(--ink);\n  border: 2px solid var(--paper-2);\n}\n.tl-dot[data-era=\"Triassic\"]   .tl-dot-marker { background: var(--triassic); }\n.tl-dot[data-era=\"Jurassic\"]   .tl-dot-marker { background: var(--jurassic); }\n.tl-dot[data-era=\"Cretaceous\"] .tl-dot-marker { background: var(--cretaceous); }\n.tl-dot.is-near .tl-dot-marker {\n  background: var(--accent);\n  border-color: var(--accent-ink);\n  outline: none;\n}\n\n.tl-tabs {\n  display: flex; flex-wrap: wrap; gap: 8px;\n  align-items: center;\n  margin: 4px 0 8px;\n}\n.tl-tabs-label {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  color: var(--ink-3); margin-right: 4px;\n}\n.tl-tab {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.1em;\n  padding: 6px 12px;\n  border: 1px solid var(--rule);\n  border-radius: 999px;\n  background: var(--paper);\n  color: var(--ink-2);\n  transition: all 140ms ease;\n}\n.tl-tab:hover { color: var(--ink); border-color: var(--ink); }\n.tl-tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n\n.tl-ticks {\n  position: absolute;\n  left: 24px; right: 24px; bottom: 4px;\n  height: 50px;\n}\n.tl-tick { position: absolute; transform: translateX(-50%); }\n.tl-tick-line {\n  width: 1px; height: 8px; background: var(--rule); margin: 0 auto 4px;\n}\n.tl-tick.major .tl-tick-line { background: var(--ink-3); height: 12px; }\n.tl-tick-label {\n  font-family: var(--mono); font-size: 10px;\n  color: var(--ink-3);\n  letter-spacing: 0.04em;\n  white-space: nowrap;\n}\n.tl-axis-label {\n  position: absolute;\n  left: 50%; bottom: -2px;\n  transform: translateX(-50%);\n  font-family: var(--mono); font-size: 10px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  color: var(--ink-3);\n  padding-top: 4px;\n}\n.tl-tick.major .tl-tick-label { color: var(--ink); font-weight: 500; }\n\n/* Scrubber bar */\n.tl-scrub-bar {\n  position: absolute;\n  top: 16px; bottom: 66px;\n  background: color-mix(in oklab, var(--ink) 12%, transparent);\n  border-left: 2px solid var(--ink);\n  border-right: 2px solid var(--ink);\n  border-radius: 4px;\n  z-index: 6;\n  cursor: grab;\n  pointer-events: auto;\n}\n.tl-scrub-bar:active { cursor: grabbing; }\n.tl-scrub-handle {\n  position: absolute;\n  top: -10px;\n  left: 50%;\n  transform: translateX(-50%);\n  background: var(--ink);\n  color: var(--paper);\n  font-family: var(--mono);\n  font-size: 12px;\n  padding: 6px 12px;\n  border-radius: 999px;\n  white-space: nowrap;\n  pointer-events: auto;\n  cursor: grab;\n  font-weight: 500;\n}\n.tl-scrub-handle small {\n  font-size: 9px; opacity: 0.7; margin-left: 3px; letter-spacing: 0.08em;\n}\n.tl-scrub-handle[data-era=\"Triassic\"]   { background: var(--triassic); }\n.tl-scrub-handle[data-era=\"Jurassic\"]   { background: var(--jurassic); }\n.tl-scrub-handle[data-era=\"Cretaceous\"] { background: var(--cretaceous); }\n\n.tl-callout-when, .tl-callout-where {\n  font-family: var(--sans); font-size: 16px; color: var(--ink);\n  margin-top: 4px;\n}\n.tl-open {\n  font-family: var(--mono); font-size: 12px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  background: var(--accent); color: var(--accent-ink);\n  padding: 12px 18px; border-radius: 999px;\n  white-space: nowrap;\n  transition: transform 180ms ease;\n}\n.tl-open:hover { transform: translateY(-2px); }\n\n@media (max-width: 760px) {\n  .tl-track { padding: 22px 16px 56px; }\n  .tl-dot-name { display: none; }\n}\n\n/* World map view styles */\n.worldmap { padding: 40px 0 80px; }\n.wm-header { max-width: 64ch; margin-bottom: 28px; }\n.wm-header h1 {\n  font-family: var(--serif); font-weight: 400;\n  font-size: clamp(48px, 7vw, 88px);\n  line-height: 1; letter-spacing: -0.03em;\n  margin: 0 0 16px;\n}\n.wm-header h1 .wm-accent {\n  background: var(--accent); color: var(--accent-ink);\n  font-style: italic; padding: 0 0.15em;\n}\n.wm-dek {\n  font-size: 16px; line-height: 1.55; color: var(--ink-2);\n  margin: 0; max-width: 56ch;\n}\n\n.wm-filters {\n  display: flex; align-items: center; flex-wrap: wrap;\n  gap: 10px; margin-bottom: 20px;\n  font-family: var(--mono); font-size: 12px;\n  text-transform: uppercase; letter-spacing: 0.14em;\n  color: var(--ink-3);\n}\n.wm-filters-label { margin-right: 4px; }\n.wm-chip {\n  font-family: var(--mono); font-size: 12px;\n  text-transform: uppercase; letter-spacing: 0.12em;\n  color: var(--ink-2);\n  padding: 9px 14px;\n  border: 1px solid var(--rule);\n  background: var(--paper);\n  transition: all 140ms ease;\n  white-space: nowrap;\n  border-radius: 999px;\n  min-height: 36px;\n}\n.wm-chip:hover { border-color: var(--ink); color: var(--ink); }\n.wm-chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n.wm-chip-clear {\n  font-family: var(--mono); font-size: 11px;\n  text-transform: uppercase; letter-spacing: 0.1em;\n  color: var(--ink-3);\n  padding: 6px 8px;\n}\n.wm-chip-clear:hover { color: var(--ink); }\n\n/* Layout: map left, sidebar right */\n.wm-layout {\n  display: grid;\n  grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);\n  gap: 32px;\n  align-items: start;\n}\n@media (max-width: 980px) {\n  .wm-layout { grid-template-columns: 1fr; gap: 24px; }\n}\n\n/* Map */\n.wm-map {\n  background: var(--paper-2);\n  border-radius: 14px;\n  padding: 24px;\n  position: sticky; top: 100px;\n}\n.wm-svg {\n  width: 100%;\n  height: auto;\n  display: block;\n  font-family: var(--mono);\n}\n.wm-grid line {\n  stroke: var(--rule);\n  stroke-width: 1;\n  stroke-dasharray: 2 4;\n  opacity: 0.5;\n}\n.wm-continent {\n  fill: var(--paper-3);\n  stroke: var(--ink);\n  stroke-width: 1.2;\n  stroke-linejoin: round;\n  transition: fill 220ms ease;\n}\n.wm-continent.is-active {\n  fill: color-mix(in oklab, var(--accent) 60%, var(--paper));\n}\n.wm-continent.is-active-country {\n  fill: var(--accent);\n  stroke: var(--accent-ink);\n  stroke-width: 1.6;\n}\n\n/* Map container holds an overlay label */\n.wm-map .wm-svg { position: relative; z-index: 1; }\n\n/* Place label sits over the bottom-left of the map */\n.wm-place-overlay {\n  position: absolute;\n  left: 36px;\n  bottom:
